<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divyansh — Systems Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="checkbox" id="theme-toggle" class="theme-toggle-input" aria-hidden="true">

    <div class="page-wrapper">
        <div class="scanlines"></div>
        <div class="grid-bg"></div>

        <label for="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></label>

        <main class="container">
            <div class="hero">
                <div class="status-line">
                    <span class="status-dot"></span>
                    <span class="status-text">SYSTEM ONLINE</span>
                </div>

                <h1 class="glitch">
                    <span class="char">D</span><span class="char">I</span><span class="char">V</span><span class="char">Y</span><span class="char">A</span><span class="char">N</span><span class="char">S</span><span class="char">H</span>
                </h1>

                <p class="tagline">
                    <span class="typing">Building systems &amp; breaking limits.</span>
                    <span class="cursor">_</span>
                </p>

                <div class="divider">
                    <span class="divider-line"></span>
                    <span class="divider-hex">◈</span>
                    <span class="divider-line"></span>
                </div>

                <nav class="nav">
                    <a href="/about-me" class="nav-link">
                        <span class="nav-bracket">[</span>ABOUT<span class="nav-bracket">]</span>
                    </a>
                    <a href="/blog" class="nav-link">
                        <span class="nav-bracket">[</span>BLOG<span class="nav-bracket">]</span>
                    </a>
                    <a href="/contact" class="nav-link">
                        <span class="nav-bracket">[</span>CONTACT<span class="nav-bracket">]</span>
                    </a>
                    <a href="https://github.com/Divyansh031" target="_blank" rel="noopener" class="nav-link external">
                        <span class="nav-bracket">[</span>GITHUB<span class="nav-bracket">]</span>
                        <span class="external-indicator">↗</span>
                    </a>
                </nav>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-line">
                <span>Copyright © 2026 Divyansh Sharma.</span>
            </div>
        </footer>
    </div>
</body>
</html>
