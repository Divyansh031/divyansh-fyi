<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Divyansh Sharma</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="blog.css">
    <script>
    (function() {
        const h = document.documentElement;
        const s = localStorage.getItem('theme');
        const d = window.matchMedia('(prefers-color-scheme: dark)').matches;
        function apply(t) { h.setAttribute('data-theme', t); localStorage.setItem('theme', t); }
        s ? apply(s) : d ? apply('dark') : apply('light');
    })();
    </script>
</head>
<body>
    <div class="page-wrapper">
        <button class="theme-toggle" aria-label="Toggle theme">
            <svg class="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg class="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>

        <main class="container">
            <header class="site-header">
                <a href="/" class="logo-link">
                    <span class="logo">D.</span>
                </a>
                <nav class="header-nav">
                    <a href="/about-me/">About</a>
                    <a href="/blog/" class="active">Blog</a>
                    <a href="/#connect">Connect</a>
                    <a href="https://github.com/divyansh031" target="_blank" rel="noopener">GitHub</a>
                </nav>
            </header>

            <section class="page-hero">
                <span class="section-num">[BLOG]</span>
                <h1 class="page-title">Posts</h1>
            </section>

            <section class="blog-list" id="blog-list">
                <p style="color: var(--text-muted);">Loading posts...</p>
            </section>
        </main>

        <footer class="footer">
            <p>© 2026 Divyansh Sharma.</p>
        </footer>
    </div>

    <script>
    (function() {
        const h = document.documentElement;
        const b = document.querySelector('.theme-toggle');
        b.addEventListener('click', () => {
            const t = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            h.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
        });
    })();

    (async function() {
        try {
            const response = await fetch('posts.json');
            const posts = await response.json();
            const list = document.getElementById('blog-list');

            if (posts.length === 0) {
                list.innerHTML = '<p style="color: var(--text-muted);">No posts yet.</p>';
                return;
            }

            list.innerHTML = posts.map(post => `
                <article class="blog-post-item">
                    <a href="post.html?post=${post.slug}" class="post-title">${post.title}</a>
                    <span class="post-meta">${post.date}</span>
                    ${post.excerpt ? `<p class="post-excerpt">${post.excerpt}</p>` : ''}
                </article>
            `).join('');

        } catch (err) {
            document.getElementById('blog-list').innerHTML = `
                <p style="color: var(--text-muted);">Unable to load posts.</p>
            `;
        }
    })();
    </script>
</body>
</html>
